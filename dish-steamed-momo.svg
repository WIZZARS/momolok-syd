<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A1714"/>
      <stop offset="60%" stop-color="#14120F"/>
      <stop offset="100%" stop-color="#0C0B09"/>
    </radialGradient>
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(201, 168, 124, 0.28)"/>
      <stop offset="100%" stop-color="rgba(240, 235, 225, 0.04)"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(240, 235, 225, 0.015)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>
  <rect width="800" height="600" fill="url(#gridPattern)"/>

  <!-- Decorative Inner Border -->
  <rect x="25" y="25" width="750" height="550" rx="16" fill="none" stroke="url(#subtleBorder)" stroke-width="1"/>
  
  <!-- Corner Geometric Accents -->
  <path d="M 45 60 L 45 45 L 60 45" fill="none" stroke="#C9A87C" stroke-width="1.5"/>
  <path d="M 755 60 L 755 45 L 740 45" fill="none" stroke="#C9A87C" stroke-width="1.5"/>
  <path d="M 45 540 L 45 555 L 60 555" fill="none" stroke="#C9A87C" stroke-width="1.5"/>
  <path d="M 755 540 L 755 555 L 740 555" fill="none" stroke="#C9A87C" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(400, 75)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="rgba(201, 168, 124, 0.06)" stroke="rgba(201, 168, 124, 0.22)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Comic Relief', 'Comic Neue', cursive, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#C9A87C">SIGNATURE DISH</text>
  </g>

  <!-- Central Illustrated Art / Icon -->
  <g transform="translate(400, 255)">
    <circle cx="0" cy="0" r="110" fill="rgba(201, 168, 124, 0.02)" stroke="rgba(201, 168, 124, 0.10)" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(240, 235, 225, 0.04)" stroke-width="1"/>
    
  <ellipse cx="0" cy="40" rx="75" ry="24" fill="none" stroke="#C9A87C" stroke-width="2.5"/>
  <path d="M -75 40 L -75 10 C -75 -10, 75 -10, 75 10 L 75 40" fill="none" stroke="#C9A87C" stroke-width="2.5"/>
  <ellipse cx="0" cy="10" rx="75" ry="24" fill="rgba(201, 168, 124, 0.08)" stroke="#D4A55A" stroke-width="2"/>
  <path d="M -22 8 C -24 -12, 0 -22, 0 -22 C 0 -22, 24 -12, 22 8 C 16 14, -16 14, -22 8 Z" fill="rgba(255, 255, 255, 0.1)" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 0 -22 L 0 5 M -8 -15 L -6 4 M 8 -15 L 6 4" stroke="#D4A55A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M -50 14 C -52 -2, -32 -10, -32 -10 C -32 -10, -14 -2, -16 14 C -22 18, -44 18, -50 14 Z" fill="rgba(255, 255, 255, 0.08)" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M 16 14 C 14 -2, 32 -10, 32 -10 C 32 -10, 52 -2, 50 14 C 44 18, 22 18, 16 14 Z" fill="rgba(255, 255, 255, 0.08)" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M -20 -35 Q -15 -48, -25 -60 Q -35 -72, -20 -85" fill="none" stroke="rgba(201, 168, 124, 0.6)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 0 -38 Q 8 -52, -2 -66 Q -12 -80, 5 -95" fill="none" stroke="rgba(201, 168, 124, 0.8)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 20 -35 Q 28 -48, 18 -62 Q 8 -76, 22 -90" fill="none" stroke="rgba(201, 168, 124, 0.6)" stroke-width="2" stroke-linecap="round"/>

  </g>

  <!-- Title & Subtitle Typography -->
  <g transform="translate(400, 435)">
    <text x="0" y="0" text-anchor="middle" font-family="'Comic Relief', 'Comic Neue', cursive, sans-serif" font-size="26" font-weight="700" fill="#F0EBE1" letter-spacing="1">Chicken Steamed Momo</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Comic Relief', 'Comic Neue', cursive, sans-serif" font-size="13" font-weight="400" fill="#A09889" letter-spacing="0.5">Hand-folded with Himalayan Timur &amp; Scallions</text>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(400, 520)">
    <text x="0" y="0" text-anchor="middle" font-family="'Comic Relief', 'Comic Neue', cursive, sans-serif" font-size="10" font-weight="600" fill="rgba(201, 168, 124, 0.35)" letter-spacing="3.5">MO MOLOK · ASHFIELD, SYDNEY</text>
  </g>
</svg>